# ==============================================================================
# Jaysonkhan.com — Hardened Nginx Configuration
# OWASP + CIS Benchmark + Mozilla SSL Config (Modern Profile)
# ==============================================================================

# ── Rate Limiting Zones ──────────────────────────────────────────────────────
# General per-IP rate limit: 10 requests/second, burst 20
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# API endpoints: stricter 5 req/s
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

# Login/auth endpoints: very strict 1 req/s (anti brute-force)
limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

# Contact form: 3 per minute
limit_req_zone $binary_remote_addr zone=contact:10m rate=3r/m;

# Connection limit per IP
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# ── Map for blocking common bad user agents ──────────────────────────────────
map $http_user_agent $bad_bot {
    default 0;
    ~*(?:sqlmap|nikto|nmap|masscan|dirbuster)      1;
    ~*(?:havij|w3af|sqlninja|paros)                 1;
    ~*(?:wget|curl)                                 0;  # Allow known tools for health checks
}

# ── HTTP → HTTPS Redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name jaysonkhan.com www.jaysonkhan.com;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://jaysonkhan.com$request_uri;
    }
}

# ── www → non-www redirect (HTTPS) ───────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jaysonkhan.com;

    # SSL certs (Let's Encrypt / Certbot)
    ssl_certificate     /etc/letsencrypt/live/jaysonkhan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jaysonkhan.com/privkey.pem;

    return 301 https://jaysonkhan.com$request_uri;
}

# ── Main HTTPS Server Block ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jaysonkhan.com;

    # ── SSL / TLS Configuration (Mozilla Modern Profile) ─────────────────────
    ssl_certificate     /etc/letsencrypt/live/jaysonkhan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jaysonkhan.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/jaysonkhan.com/chain.pem;

    # TLS 1.2 and 1.3 only — disable SSLv3, TLS 1.0, TLS 1.1
    ssl_protocols TLSv1.2 TLSv1.3;

    # Strong cipher suites only (no RC4, no DES, no export)
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # DH params for DHE ciphers (generate: openssl dhparam -out /etc/nginx/dhparam.pem 2048)
    # ssl_dhparam /etc/nginx/dhparam.pem;

    # SSL session settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # ── Security Headers ─────────────────────────────────────────────────────
    # HSTS: 1 year, include subdomains, preload
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy — strict but functional
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://telegram.org https://oauth.telegram.org https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com https://mc.yandex.ru https://mc.yandex.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.telegram.org https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://mc.yandex.ru https://mc.yandex.com; frame-src 'self' https://oauth.telegram.org https://mc.yandex.ru; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; base-uri 'self'; form-action 'self' https://oauth.telegram.org; object-src 'none'; upgrade-insecure-requests;" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Clickjacking protection (CSP frame-ancestors supersedes this;
    # kept for legacy browsers but allows Telegram Mini App iframes)
    # add_header X-Frame-Options "SAMEORIGIN" always;

    # XSS Filter (legacy but still useful)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer policy — send origin only for cross-origin
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions policy — disable unnecessary browser features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # CORP, COEP, COOP
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Hide server version
    server_tokens off;
    # Note: To fully hide "Server: nginx", install nginx-extras and use:
    # more_set_headers "Server: jaysonkhan";

    # ── Request Limits ───────────────────────────────────────────────────────
    client_max_body_size 10m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 65s;
    large_client_header_buffers 4 8k;

    # Connection limit
    limit_conn conn_per_ip 20;

    # Block bad bots
    if ($bad_bot) {
        return 444;
    }

    # ── Gzip / Brotli Compression ────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ── Static Files ─────────────────────────────────────────────────────────
    location /static/ {
        alias /var/www/jaysonkhan/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location /media/ {
        alias /var/www/jaysonkhan/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;

        # Prevent script execution in upload directory
        location ~* \.(php|py|pl|sh|cgi|asp|aspx|jsp|exe|bat)$ {
            deny all;
        }
    }

    # ── Favicon ──────────────────────────────────────────────────────────────
    location = /favicon.ico {
        alias /var/www/jaysonkhan/static/images/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # Note: /robots.txt is served by the Django view (apps.core.views.robots_txt)
    # to get dynamic Sitemap URL + professional bot-blocking policy.

    # ── Block dotfiles (except .well-known) ──────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.well-known/ {
        allow all;
    }

    # ── Block common exploit paths ───────────────────────────────────────────
    location ~* /(\.git|\.env|\.svn|\.hg|wp-admin|wp-login|xmlrpc|phpmyadmin|adminer|\.bak|\.sql|\.tar\.gz|\.zip) {
        deny all;
        return 444;
    }

    # ── Admin panel — IP restrict (update with your IPs) ─────────────────────
    # Read from env-based URL, but add IP restriction
    location ~ ^/jk-[a-z0-9-]+/ {
        limit_req zone=auth burst=5 nodelay;

        # Uncomment and set your IP to restrict admin access:
        # allow YOUR_IP_HERE;
        # deny all;

        # Admin-specific CSP: 'unsafe-eval' required by Alpine.js (Unfold admin theme)
        # Note: add_header in a location block overrides parent headers, so all
        # security headers must be repeated here explicitly.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://telegram.org https://oauth.telegram.org https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.telegram.org; frame-src https://oauth.telegram.org; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; base-uri 'self'; form-action 'self' https://oauth.telegram.org; object-src 'none'; upgrade-insecure-requests;" always;
        add_header X-Content-Type-Options "nosniff" always;
        # add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

        proxy_pass http://unix:/var/www/jaysonkhan/backend/jaysonkhan.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API Endpoints ────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=10 nodelay;

        proxy_pass http://unix:/var/www/jaysonkhan/backend/jaysonkhan.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Anti-SSRF: Don't follow redirects to internal networks
        proxy_redirect off;
    }

    # ── Auth Endpoints (very strict rate limit) ──────────────────────────────
    location /auth/ {
        limit_req zone=auth burst=3 nodelay;

        proxy_pass http://unix:/var/www/jaysonkhan/backend/jaysonkhan.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Contact Form ─────────────────────────────────────────────────────────
    location = /contact/ {
        limit_req zone=contact burst=2 nodelay;

        proxy_pass http://unix:/var/www/jaysonkhan/backend/jaysonkhan.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Default Django App ───────────────────────────────────────────────────
    location / {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://unix:/var/www/jaysonkhan/backend/jaysonkhan.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # ── Disable directory listing ────────────────────────────────────────────
    autoindex off;

    # ── Error pages ──────────────────────────────────────────────────────────
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    # ── Access & Error Logs ──────────────────────────────────────────────────
    access_log /var/log/nginx/jaysonkhan_access.log;
    error_log  /var/log/nginx/jaysonkhan_error.log warn;
}
