{% extends 'web/base.html' %}

{% block title %}Server Error — {{ site_settings.site_title }}{% endblock %}

{% block content %}
<section class="min-h-[70vh] flex items-center justify-center px-6 py-32">
    <div class="text-center max-w-md mx-auto">

        <!-- Icon -->
        <div class="relative inline-flex items-center justify-center mb-8">
            <div class="absolute w-32 h-32 rounded-full bg-red-500/10 animate-pulse"></div>
            <div class="relative w-24 h-24 rounded-full bg-white/5 border border-white/10
                        flex items-center justify-center backdrop-blur-sm">
                <i class="fa-solid fa-triangle-exclamation text-4xl text-red-400/70"></i>
            </div>
        </div>

        <h1 class="text-2xl font-bold mb-3 text-white">Something went wrong</h1>
        <p class="text-slate-400 text-base leading-relaxed mb-8">
            An unexpected error occurred on the server.<br>
            It's been noted — please try again in a moment.
        </p>

        <a href="{% url 'home' %}" class="inline-flex items-center gap-2 bg-primary hover:bg-secondary
                  px-6 py-3 rounded-xl transition font-semibold">
            <i class="fa-solid fa-arrow-left text-sm"></i>
            Back to Home
        </a>

    </div>
</section>
{% endblock %}
